<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>小账本 · 记账工作台</title>
<style>
/* ============ 小账本 · 设计系统 ============ */
:root {
  --bg: #0b1016;
  --bg-soft: #0e141c;
  --surface: #141c26;
  --surface-2: #19232f;
  --surface-3: #22303f;
  --line: rgba(255,255,255,.075);
  --line-strong: rgba(255,255,255,.15);
  --text: #eaf0f7;
  --text-2: #a9b8c9;
  --muted: #76879b;
  --accent: #5ee0a0;
  --accent-ink: #06231a;
  --accent-2: #8a96ff;
  --income: #4ade9f;
  --expense: #ff7d8e;
  --transfer: #8fa6ff;
  --warn: #ffb65c;
  --shadow: 0 18px 48px rgba(0,0,0,.42);
  --shadow-sm: 0 6px 20px rgba(0,0,0,.22);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar-w: 236px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
html[data-theme="light"] {
  --bg: #f4f6fb;
  --bg-soft: #edf1f8;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #e9eef6;
  --line: rgba(24,40,66,.09);
  --line-strong: rgba(24,40,66,.17);
  --text: #1b2637;
  --text-2: #4b5c73;
  --muted: #8493a7;
  --accent: #10a76e;
  --accent-ink: #ffffff;
  --accent-2: #5a68e6;
  --income: #0a9e69;
  --expense: #e2546a;
  --transfer: #5a68e6;
  --warn: #c9800f;
  --shadow: 0 18px 44px rgba(28,45,75,.11);
  --shadow-sm: 0 6px 18px rgba(28,45,75,.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(760px 420px at 13% -8%, rgba(94,224,160,.075), transparent 65%),
    radial-gradient(700px 460px at 92% 4%, rgba(138,150,255,.075), transparent 65%);
}
html[data-theme="light"] body::before {
  background:
    radial-gradient(760px 420px at 13% -8%, rgba(16,167,110,.07), transparent 65%),
    radial-gradient(700px 460px at 92% 4%, rgba(90,104,230,.065), transparent 65%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--accent); text-decoration: none; }
::selection { background: rgba(94,224,160,.28); }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; letter-spacing: -.02em; }
.hide-amount { filter: blur(7px); user-select: none; transition: filter .18s; }

/* ============ 布局 ============ */
.app { position: relative; z-index: 1; display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex: none; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 26px 16px 20px;
  background: linear-gradient(180deg, var(--bg-soft), var(--bg));
  border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 26px; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
  font-size: 19px; font-weight: 800; color: var(--accent-ink);
  background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  box-shadow: 0 8px 22px rgba(94,224,160,.22);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.3; }
.brand-text strong { font-size: 16px; letter-spacing: .02em; }
.brand-text span { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 11px;
  color: var(--text-2); font-size: 13.5px; font-weight: 500; text-align: left;
  transition: background .18s, color .18s, transform .18s; position: relative;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.nav-item.active::before {
  content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 22px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item.active .ic { color: var(--accent); }
.nav-item .ic { width: 17px; height: 17px; }
.sidebar-foot { margin-top: auto; }
.side-tools { display: flex; gap: 8px; padding: 0 4px 14px; }
.side-note {
  display: flex; gap: 8px; align-items: flex-start; padding: 11px 12px; border-radius: 11px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.5;
}
.side-note .ic { width: 14px; height: 14px; margin-top: 2px; }
.side-version { padding: 12px 6px 0; font-size: 10.5px; color: var(--muted); opacity: .75; letter-spacing: .03em; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 24px 34px 18px; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(18px); border-bottom: 1px solid var(--line);
}
.topbar-title h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.topbar-title p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.month-picker {
  display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 11px;
}
.month-label { padding: 6px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; min-width: 112px; }
.month-label:hover { color: var(--accent); }
.content { padding: 24px 34px 8px; flex: 1; animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.foot-hint { padding: 18px 34px 26px; color: var(--muted); font-size: 11.5px; opacity: .8; }
.foot-hint kbd { margin: 0 2px; }
.fab { display: none; }

/* ============ 通用组件 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 15px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--line-strong); color: var(--text-2); background: var(--surface-2);
  transition: transform .15s, background .18s, color .18s, border-color .18s, box-shadow .18s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); color: var(--text); border-color: var(--line-strong); }
.btn:active { transform: translateY(0); }
.btn .ic { width: 16px; height: 16px; }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #fff));
  color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 18px rgba(94,224,160,.2);
}
.btn-primary:hover { color: var(--accent-ink); box-shadow: 0 9px 24px rgba(94,224,160,.28); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--expense); border-color: color-mix(in srgb, var(--expense) 32%, transparent); background: color-mix(in srgb, var(--expense) 9%, transparent); }
.btn-danger:hover { color: var(--expense); background: color-mix(in srgb, var(--expense) 16%, transparent); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 9px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  color: var(--text-2); border: 1px solid transparent; transition: background .18s, color .18s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn.sm .ic { width: 15px; height: 15px; }
.icon-btn.danger:hover { color: var(--expense); background: color-mix(in srgb, var(--expense) 12%, transparent); }
kbd {
  font: 600 10px/1 var(--font); padding: 3px 5px; border-radius: 5px;
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.06); color: inherit; opacity: .8;
}
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow-sm); min-width: 0;
}
.welcome-card {
  display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 11%, var(--surface)), var(--surface) 72%);
  border-color: color-mix(in srgb, var(--accent) 25%, var(--line));
}
.wc-ico {
  width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.wc-ico .ic { width: 22px; height: 22px; }
.wc-title { font-size: 15px; font-weight: 680; }
.wc-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
.demo-banner {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 11px 16px; border-radius: 12px;
  font-size: 12px; color: var(--text-2);
  background: color-mix(in srgb, var(--warn) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warn) 32%, var(--line));
}
.demo-banner .ic { color: var(--warn); }
.demo-banner strong { color: var(--text); }
.demo-banner button { margin-left: auto; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card-head h3 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.card-head .sub { font-size: 11.5px; color: var(--muted); }
.card-head-actions { display: flex; align-items: center; gap: 6px; }
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); }
.g-1-2 { grid-template-columns: minmax(0,1fr) minmax(0,1.65fr); }
.stack { display: grid; gap: 16px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 14px; }
.section-title h2 { margin: 0; font-size: 15px; font-weight: 650; }
.section-title .hint { font-size: 11.5px; color: var(--muted); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.muted { color: var(--muted); }
.tiny { font-size: 11.5px; }
.pos { color: var(--income); }
.neg { color: var(--expense); }
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; background: var(--surface-3); color: var(--text-2); white-space: nowrap;
}
.badge.good { background: color-mix(in srgb, var(--income) 14%, transparent); color: var(--income); }
.badge.bad { background: color-mix(in srgb, var(--expense) 14%, transparent); color: var(--expense); }
.badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.empty {
  display: grid; place-items: center; gap: 10px; padding: 42px 20px; text-align: center;
  color: var(--muted); font-size: 13px;
}
.empty .empty-icon {
  width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.empty .empty-icon .ic { width: 22px; height: 22px; }
.empty strong { color: var(--text-2); font-size: 14px; font-weight: 600; }
.card > .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 210px; }

/* ============ 概览数字卡 ============ */
.stat-card { position: relative; overflow: hidden; padding: 20px 22px; }
.stat-card::after {
  content: ""; position: absolute; right: -40px; top: -60px; width: 170px; height: 170px; border-radius: 50%;
  background: radial-gradient(circle, var(--glow, rgba(94,224,160,.16)), transparent 70%); pointer-events: none;
}
.stat-card .stat-label { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12.5px; }
.stat-card .stat-label .ic { width: 15px; height: 15px; }
.stat-card .stat-value { margin-top: 10px; font-size: clamp(24px, 2.5vw, 31px); font-weight: 720; letter-spacing: -.035em; line-height: 1.2; }
.stat-card .stat-foot { margin-top: 10px; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.stat-card.hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 13%, var(--surface)), var(--surface) 62%); border-color: color-mix(in srgb, var(--accent) 24%, var(--line)); }
.trend-pill { display: inline-flex; align-items: center; gap: 3px; font-weight: 650; }
.trend-pill .ic { width: 12px; height: 12px; stroke-width: 2.4; }

/* ============ 图表 ============ */
.chart-svg { display: block; width: 100%; overflow: visible; }
.chart-svg text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.chart-svg .grid-line { stroke: var(--line); stroke-width: 1; }
.chart-svg .axis-label { font-size: 10.5px; }
.chart-legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2); }
.chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.donut-wrap { display: flex; align-items: center; gap: 22px; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center .dc-label { font-size: 11px; color: var(--muted); }
.donut-center .dc-value { font-size: 19px; font-weight: 700; letter-spacing: -.03em; }
.donut-box { position: relative; width: 168px; height: 168px; flex: none; }
.cat-legend { flex: 1; min-width: 0; display: grid; gap: 9px; }
.cat-legend-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 9px; align-items: center; font-size: 12px; }
.cat-legend-row i { width: 10px; height: 10px; border-radius: 3px; }
.cat-legend-row .cl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.cat-legend-row .cl-val { font-weight: 600; }
.cat-legend-row .cl-pct { color: var(--muted); font-size: 10.5px; margin-left: 5px; font-weight: 400; }
.bar-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 12px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-row .br-name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar-row .br-val { min-width: 78px; text-align: right; font-weight: 600; }
.heat-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.heat-cell {
  aspect-ratio: 1.35; max-height: 44px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 10.5px; color: var(--text-2); position: relative;
}
.heat-cell.blank { background: transparent; border-color: transparent; }
.heat-cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.heat-week { text-align: center; font-size: 10.5px; color: var(--muted); padding-bottom: 4px; }

/* ============ 交易列表 ============ */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.search-box {
  display: flex; align-items: center; gap: 9px; padding: 0 12px; height: 38px; min-width: 210px; flex: 1;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--muted);
}
.search-box:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; color: var(--text); }
.search-box .ic { width: 16px; height: 16px; }
select, .field input, .field textarea, .input {
  width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); outline: none; transition: border-color .18s, box-shadow .18s;
}
select { height: 38px; padding: 0 11px; appearance: none; padding-right: 28px;
  background-image: linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px,5px 5px; background-repeat: no-repeat;
}
select:focus, .field input:focus, .field textarea:focus, .input:focus {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
}
select option { background: var(--surface); color: var(--text); }
.chip {
  padding: 6px 12px; border-radius: 9px; font-size: 12px; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
}
.chip:hover { color: var(--text); border-color: var(--line-strong); }
.chip.active { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); font-weight: 600; }
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.day-group { margin-bottom: 18px; }
.day-head {
  display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px;
  font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px;
}
.txn-row {
  display: grid; grid-template-columns: 38px minmax(0,1fr) auto 30px; gap: 12px; align-items: center;
  padding: 11px 6px; border-radius: 11px; transition: background .16s;
}
.txn-row:hover { background: var(--surface-2); }
.txn-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); border: 1px solid var(--line); }
.txn-main { min-width: 0; }
.txn-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txn-sub { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 7px; flex-wrap: wrap; }
.txn-sub .dot { opacity: .5; }
.txn-amount { text-align: right; font-size: 14px; font-weight: 680; letter-spacing: -.02em; white-space: nowrap; }
.txn-amount small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
.txn-row .row-actions { opacity: 0; display: flex; gap: 2px; transition: opacity .16s; }
.txn-row:hover .row-actions, .txn-row:focus-within .row-actions { opacity: 1; }
.row-actions .icon-btn { width: 28px; height: 28px; }
.row-actions .ic { width: 14px; height: 14px; }
.tag-pill { padding: 1px 6px; border-radius: 5px; background: var(--surface-3); font-size: 10px; color: var(--text-2); }

/* ============ 表单 / 模态 ============ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px;
  background: rgba(5,9,14,.66); backdrop-filter: blur(6px); animation: fadeIn .18s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(520px, 100%); max-height: min(88vh, 860px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 20px;
  box-shadow: var(--shadow); animation: modalIn .22s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.modal.wide { width: min(720px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 14px; }
.modal-head h3 { margin: 0; font-size: 16px; font-weight: 680; }
.modal-head .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.modal-body { padding: 4px 22px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 22px 20px; border-top: 1px solid var(--line); }
.modal-foot .left { margin-right: auto; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label { font-size: 11.5px; color: var(--text-2); font-weight: 600; }
.field .hint { font-size: 10.5px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 11px; border: 1px solid var(--line); }
.seg button { flex: 1; padding: 8px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); transition: background .18s, color .18s; }
.seg button.active { background: var(--surface-3); color: var(--text); box-shadow: var(--shadow-sm); }
.seg button[data-type="expense"].active { color: var(--expense); }
.seg button[data-type="income"].active { color: var(--income); }
.seg button[data-type="transfer"].active { color: var(--transfer); }
.amount-input {
  width: 100%; padding: 10px 14px 10px 34px; font-size: 27px; font-weight: 700; letter-spacing: -.03em;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); outline: none;
  font-variant-numeric: tabular-nums;
}
.amount-wrap { position: relative; }
.amount-wrap .cur { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 19px; color: var(--muted); font-weight: 600; }
.amount-input:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.cat-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; max-height: 186px; overflow-y: auto; padding: 2px; }
.cat-opt {
  display: grid; place-items: center; gap: 3px; padding: 9px 3px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 10.5px; color: var(--text-2);
  transition: transform .15s, border-color .15s, background .15s;
}
.cat-opt:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.cat-opt.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); color: var(--text); font-weight: 600; }
.cat-opt .emoji { font-size: 19px; line-height: 1.2; }
.checkbox-line { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.checkbox-line input { width: 16px; height: 16px; accent-color: var(--accent); }
.suggest-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.suggest-tags button { font-size: 10.5px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.suggest-tags button:hover { color: var(--accent); }
.icon-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
.icon-grid button { aspect-ratio: 1; border-radius: 9px; font-size: 17px; background: var(--surface-2); border: 1px solid var(--line); }
.icon-grid button.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); }
.color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.color-grid button { width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent; }
.color-grid button.active { outline: 2px solid var(--text); outline-offset: 2px; }

/* ============ 预算 / 账户 / 目标 ============ */
.progress-line { display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
.progress-line .pl-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.progress-line .pl-amt { color: var(--muted); font-size: 11.5px; }
.progress-track { height: 9px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; transition: width .55s cubic-bezier(.2,.8,.2,1); }
.progress-fill.over { background: var(--expense) !important; }
.budget-item { padding: 13px 0; border-bottom: 1px solid var(--line); }
.budget-item:last-child { border-bottom: 0; padding-bottom: 0; }
.budget-item:first-child { padding-top: 0; }
.account-card { display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.account-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--acc, var(--accent)); }
.acc-top { display: flex; align-items: center; gap: 11px; }
.acc-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: var(--surface-2); border: 1px solid var(--line); }
.acc-name { font-size: 13.5px; font-weight: 650; }
.acc-type { font-size: 11px; color: var(--muted); }
.acc-balance { font-size: 24px; font-weight: 720; letter-spacing: -.03em; }
.acc-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 11px; }
.goal-card { display: grid; gap: 11px; }
.goal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.goal-emoji { font-size: 22px; }
.goal-name { font-weight: 650; font-size: 13.5px; }
.goal-meta { font-size: 11px; color: var(--muted); }
.goal-nums { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; }
.goal-nums strong { font-size: 17px; letter-spacing: -.02em; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .sr-title { font-size: 13px; font-weight: 600; }
.setting-row .sr-desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.setting-row .sr-ctrl { display: flex; align-items: center; gap: 8px; flex: none; }
.switch { width: 40px; height: 23px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); padding: 2px; transition: background .2s; }
.switch::after { content: ""; display: block; width: 17px; height: 17px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch.on { background: color-mix(in srgb, var(--accent) 28%, var(--surface-3)); }
.switch.on::after { transform: translateX(17px); background: var(--accent); }
.manage-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.manage-row:last-child { border-bottom: 0; }
.manage-row .mr-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; background: var(--surface-2); border: 1px solid var(--line); }
.manage-row .mr-name { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; }
.tabs button { padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.tabs button.active { background: var(--surface-3); color: var(--text); box-shadow: var(--shadow-sm); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; }
.kpi { padding: 15px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.kpi .k-label { font-size: 11.5px; color: var(--muted); }
.kpi .k-value { font-size: 20px; font-weight: 700; letter-spacing: -.03em; margin-top: 5px; }
.kpi .k-foot { font-size: 10.5px; color: var(--muted); margin-top: 3px; }

/* ============ Toast ============ */
.toast-root { position: fixed; right: 22px; bottom: 22px; z-index: 200; display: grid; gap: 9px; justify-items: end; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 9px; padding: 11px 15px; border-radius: 12px;
  background: var(--surface-3); border: 1px solid var(--line-strong); box-shadow: var(--shadow);
  font-size: 12.5px; font-weight: 550; animation: toastIn .25s cubic-bezier(.2,.8,.2,1) both;
  pointer-events: auto;
}
.toast button { color: var(--accent); font-size: 12px; font-weight: 700; padding: 2px 4px; }
.toast .ic { width: 16px; height: 16px; color: var(--accent); }
.toast.err .ic { color: var(--expense); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
.toast.out { animation: toastOut .22s ease both; }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }

/* ============ 滚动条 ============ */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ============ 响应式 ============ */
@media (max-width: 1180px) {
  .g-2-1, .g-1-2 { grid-template-columns: 1fr; }
  .g-3, .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 900px) {
  :root { --sidebar-w: 68px; }
  .sidebar { padding: 22px 10px 16px; align-items: center; }
  .brand { padding: 0 0 24px; }
  .brand-text, .nav-item span, .side-note, .side-version { display: none; }
  .nav-item { justify-content: center; padding: 12px; width: 46px; }
  .nav-item.active::before { left: -10px; }
  .nav-item .ic { width: 19px; height: 19px; }
  .side-tools { flex-direction: column; padding: 0 0 8px; }
  .topbar { padding: 18px 20px 14px; }
  .content { padding: 18px 20px 6px; }
  .foot-hint { padding: 16px 20px 22px; }
}
@media (max-width: 680px) {
  .app { display: block; }
  .sidebar {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: 100%; height: auto; z-index: 50;
    flex-direction: row; padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--line-strong); background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px);
  }
  .brand, .sidebar-foot { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; gap: 2px; }
  .nav-item { flex: 1; width: auto; flex-direction: column; gap: 3px; padding: 6px 2px; border-radius: 10px; }
  .nav-item span { display: block; font-size: 9.5px; font-weight: 500; }
  .nav-item.active::before { display: none; }
  .nav-item .ic { width: 19px; height: 19px; }
  .main { padding-bottom: 72px; }
  .topbar { flex-wrap: wrap; gap: 12px; padding: 15px 16px 12px; }
  .topbar-title h1 { font-size: 19px; }
  .topbar-title p { display: none; }
  .topbar-actions { width: 100%; justify-content: space-between; }
  #addBtn kbd { display: none; }
  .content { padding: 16px 14px 4px; }
  .g-3, .g-2, .g-4 { grid-template-columns: 1fr; }
  .grid { gap: 12px; }
  .card { padding: 16px; border-radius: 15px; }
  .welcome-card, .demo-banner { flex-wrap: wrap; }
  .demo-banner button { margin-left: 0; }
  .stat-card { padding: 16px 18px; }
  .donut-wrap { flex-direction: column; align-items: stretch; }
  .donut-box { margin: 0 auto; }
  .txn-row { grid-template-columns: 34px minmax(0,1fr) auto; }
  .txn-row .row-actions { display: none; }
  .txn-ico { width: 34px; height: 34px; }
  .foot-hint { display: none; }
  .fab {
    display: grid; place-items: center; position: fixed; right: 18px; bottom: 84px; z-index: 45;
    width: 52px; height: 52px; border-radius: 17px; color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #fff));
    box-shadow: 0 10px 26px rgba(94,224,160,.32);
  }
  .fab .ic { width: 24px; height: 24px; stroke-width: 2.2; }
  .modal { border-radius: 18px; }
  .modal-head, .modal-body, .modal-foot { padding-left: 16px; padding-right: 16px; }
  .cat-picker { grid-template-columns: repeat(5, 1fr); }
  .field-row { grid-template-columns: 1fr; gap: 0; }
  .toast-root { right: 12px; left: 12px; bottom: 82px; justify-items: center; }
}

/* ---------- 微信 / 支付宝账单导入 ---------- */
.bill-hero {
  border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
  background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface) 55%);
}
.bill-hero-head { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; flex-wrap: wrap; }
.bill-hero-ico {
  width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
.bill-hero-ico .ic { width: 20px; height: 20px; }
.bill-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.bill-steps > div {
  padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line);
  display: grid; gap: 5px; line-height: 1.65;
}
.bill-steps b { font-size: 12px; color: var(--text); font-weight: 650; }
.bill-steps span { font-size: 11.5px; color: var(--text-2); }

.bill-src {
  display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 11px;
  background: color-mix(in srgb, var(--accent) 10%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line)); margin-bottom: 14px;
}
.bill-src .ic { color: var(--accent); width: 18px; height: 18px; flex: none; }
.bill-src strong { font-size: 12.5px; font-weight: 650; }
.bill-error {
  padding: 12px 14px; border-radius: 11px; line-height: 1.7; font-size: 12.5px;
  color: var(--expense); background: color-mix(in srgb, var(--expense) 10%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--expense) 28%, var(--line));
}
.bill-error strong { display: block; margin-bottom: 3px; }
.bill-error .muted { color: var(--text-2) !important; }
.bill-none {
  padding: 26px 16px; text-align: center; border-radius: 12px; background: var(--surface-2);
  color: var(--text-2); font-size: 13px; line-height: 1.8;
}
.bill-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 16px; }
.bill-stat {
  padding: 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line);
  display: grid; gap: 3px; text-align: center;
}
.bill-stat b { font-size: 20px; font-weight: 680; letter-spacing: -.02em; }
.bill-stat span { font-size: 11px; color: var(--muted); }
.bill-opts { display: flex; align-items: end; gap: 16px; margin-bottom: 10px; }
.bill-opts .field { flex: 1; margin-bottom: 0; min-width: 0; }
.bill-chk {
  display: flex; align-items: center; gap: 7px; padding-bottom: 9px;
  font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap;
}
.bill-chk input { accent-color: var(--accent); width: 15px; height: 15px; }
.bill-skip { line-height: 1.7; margin-bottom: 12px; }
.bill-table-wrap { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 11px; }
.bill-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.bill-table th {
  position: sticky; top: 0; z-index: 1; text-align: left; padding: 9px 11px; font-weight: 650;
  color: var(--muted); background: var(--surface-3); border-bottom: 1px solid var(--line);
}
.bill-table td { padding: 8px 11px; border-bottom: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.bill-table tr:last-child td { border-bottom: 0; }
.bill-table .bill-note { max-width: 230px; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.bill-cat {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10.5px;
  background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent);
}
@media (max-width: 720px) {
  .bill-hero-head { gap: 10px; }
  .bill-hero-head .btn { width: 100%; }
  .bill-steps { grid-template-columns: 1fr; }
  .bill-stats { grid-template-columns: repeat(2, 1fr); }
  .bill-opts { flex-direction: column; align-items: stretch; gap: 10px; }
  .bill-chk { padding-bottom: 0; }
  .bill-table th:nth-child(2), .bill-table td:nth-child(2) { display: none; }
  .bill-table .bill-note { max-width: 130px; }
}

<script>
/* ============ 自绘 SVG 图表（零依赖，深浅主题自动适配） ============ */
var Charts = (function () {
  function compact(v) {
    var a = Math.abs(v);
    var s = v < 0 ? '-' : '';
    if (a >= 100000000) return s + (a / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
    if (a >= 10000) return s + (a / 10000).toFixed(1).replace(/\.0$/, '') + '万';
    if (a >= 1000) return s + (a / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return s + Math.round(a);
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* 收入 / 支出 分组柱状图 */
  function bars(items) {
    var W = 640, H = 208, L = 46, R = 12, T = 14, B = 30;
    var pw = W - L - R, ph = H - T - B;
    var max = 1;
    items.forEach(function (d) { max = Math.max(max, d.income, d.expense); });
    max = max * 1.18;
    var s = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="收支趋势图">';
    for (var i = 0; i <= 3; i++) {
      var y = T + ph - (ph * i / 3);
      s += '<line class="grid-line" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/>';
      s += '<text x="' + (L - 9) + '" y="' + (y + 4) + '" text-anchor="end" class="axis-label">' + compact(max * i / 3) + '</text>';
    }
    if (!items.length) return s + '</svg>';
    var gw = pw / items.length;
    var bw = Math.min(19, Math.max(6, gw * 0.27));
    items.forEach(function (d, idx) {
      var cx = L + gw * idx + gw / 2;
      var hi = ph * (d.income / max), he = ph * (d.expense / max);
      var xi = cx - bw - 2, xe = cx + 2;
      s += '<rect x="' + xi + '" y="' + (T + ph - hi) + '" width="' + bw + '" height="' + Math.max(0, hi) + '" rx="3" style="fill:var(--income)" opacity=".92"><title>' + esc(d.label) + ' 收入 ' + compact(d.income) + '</title></rect>';
      s += '<rect x="' + xe + '" y="' + (T + ph - he) + '" width="' + bw + '" height="' + Math.max(0, he) + '" rx="3" style="fill:var(--expense)" opacity=".92"><title>' + esc(d.label) + ' 支出 ' + compact(d.expense) + '</title></rect>';
      s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" class="axis-label">' + esc(d.label) + '</text>';
    });
    return s + '</svg>';
  }

  /* 环形图 */
  function donut(items) {
    var total = items.reduce(function (a, b) { return a + b.value; }, 0);
    var r = 64, c = 2 * Math.PI * r, cx = 84, cy = 84;
    var s = '<svg class="chart-svg" viewBox="0 0 168 168" role="img" aria-label="分类占比图">';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke-width="18" style="stroke:var(--surface-3)"/>';
    if (total > 0) {
      var acc = 0;
      items.forEach(function (d) {
        var len = c * (d.value / total);
        if (len <= 0) return;
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke-width="18" stroke-linecap="butt" stroke="' + esc(d.color) + '"'
          + ' stroke-dasharray="' + (len - 1.2 > 0 ? len - 1.2 : len) + ' ' + (c - len + 1.2) + '" stroke-dashoffset="' + (-acc) + '"'
          + ' transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(d.name) + ' ' + compact(d.value) + '</title></circle>';
        acc += len;
      });
    }
    return s + '</svg>';
  }

  /* 结余 / 累计折线 + 面积 */
  function line(values, labels) {
    var W = 640, H = 200, L = 46, R = 14, T = 16, B = 28;
    var pw = W - L - R, ph = H - T - B;
    if (!values.length) return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '"></svg>';
    var mx = Math.max.apply(null, values.concat([0])), mn = Math.min.apply(null, values.concat([0]));
    var pad = (mx - mn) * 0.16 || 1;
    mx += pad; mn -= pad;
    var span = mx - mn || 1;
    var X = function (i) { return L + (values.length === 1 ? pw / 2 : pw * i / (values.length - 1)); };
    var Y = function (v) { return T + ph - ((v - mn) / span) * ph; };
    var s = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="结余走势图">';
    s += '<defs><linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" style="stop-color:var(--accent);stop-opacity:.30"/>'
      + '<stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
    for (var i = 0; i <= 3; i++) {
      var y = T + ph - (ph * i / 3), val = mn + span * i / 3;
      s += '<line class="grid-line" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/>';
      s += '<text x="' + (L - 9) + '" y="' + (y + 4) + '" text-anchor="end" class="axis-label">' + compact(val) + '</text>';
    }
    var zero = Y(0);
    s += '<line x1="' + L + '" y1="' + zero + '" x2="' + (W - R) + '" y2="' + zero + '" style="stroke:var(--line-strong)" stroke-dasharray="4 4"/>';
    var d = values.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
    var area = d + ' L' + X(values.length - 1).toFixed(1) + ' ' + zero.toFixed(1) + ' L' + X(0).toFixed(1) + ' ' + zero.toFixed(1) + ' Z';
    s += '<path d="' + area + '" fill="url(#lineGrad)"/>';
    s += '<path d="' + d + '" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)"/>';
    values.forEach(function (v, i) {
      s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3.4" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"><title>' + esc(labels[i]) + ' ' + compact(v) + '</title></circle>';
      s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle" class="axis-label">' + esc(labels[i]) + '</text>';
    });
    return s + '</svg>';
  }

  /* 单色横向柱（用于年度分类对比） */
  function hbars(items, color) {
    var max = Math.max.apply(null, items.map(function (d) { return d.value; }).concat([1]));
    return items.map(function (d) {
      var pct = Math.max(0, (d.value / max) * 100);
      return '<div class="bar-row"><div class="br-name">' + esc(d.name) + '</div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%;background:' + esc(d.color || color || 'var(--accent)') + '"></div></div>'
        + '<div class="br-val num">' + compact(d.value) + '</div></div>';
    }).join('');
  }

  return { bars: bars, donut: donut, line: line, hbars: hbars, compact: compact };
})();

</script>
<script>
/* ============ 账单导入：解析微信支付 / 支付宝官方导出的 CSV ============

var BillImport = (function () {

    ['通讯', ['话费', '中国移动', '中国联通', '中国电信', '流量', '充值中心', '手机充值']],
    ['旅行', ['机票', '航空', '酒店', '民宿', '携程', '去哪儿', '飞猪', '火车票', '景区', '旅行', '旅游', '途牛', '同程', '住宿', '客栈', '度假']],
    ['学习', ['教育', '课程', '培训', '考试', '学费', '文具', '网课', '学习', '书店', '教材', '报名费', '论文', '图书', '知识付费']],

    ['日用', ['超市', '便利店', '永辉', '沃尔玛', '盒马', '华润万家', '大润发', '日用品', '家居', '洗护', '洗衣', '家政', '保洁', '五金', '菜市场', '生鲜', '买菜', '物美', '屈臣氏', '名创']],
    ['购物', ['淘宝', '天猫', '京东', '拼多多', '唯品会', '抖音商城', '得物', '服饰', '服装', '鞋', '数码', '小米', '苹果', '华为', '商场', '专卖店', '耐克', '优衣库', '化妆品', '护肤', '网购', '苏宁', '电子产品']],
    ['人情', ['红包', '随礼', '礼物', '请客', '亲属卡', '人情', '份子', '公益', '捐赠']]
  ];
  var INCOME_RULES = [
    ['工资', ['工资', '薪资', '薪酬', '劳务', '代发', '月薪']],
    ['奖金', ['奖金', '绩效', '年终', '奖励', '提成']],
    ['兼职', ['兼职', '稿费', '项目结算', '服务费', '报酬', '佣金']],
    ['理财', ['理财', '收益', '利息', '基金', '分红', '赎回', '余额宝']],
    ['红包', ['红包', '转账收款', '收款', '亲属卡']]
  ];

  /* ---------- 编码：微信多是 UTF-8(BOM)，支付宝多是 GBK/GB18030 ---------- */
  function decode(buf) {
    var bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    if (!bytes.length) return { text: '', encoding: '空文件' };
    if (bytes.length > 2 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
      return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'UTF-8 (BOM)' };
    }
    try {
      return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), encoding: 'UTF-8' };
    } catch (e) {
      try { return { text: new TextDecoder('gb18030').decode(bytes), encoding: 'GBK / GB18030' }; }
      catch (e2) { return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'UTF-8 (容错)' }; }
    }
  }

  /* ---------- CSV 切分：支持引号包裹、字段内逗号与换行 ---------- */
  function splitRows(text, delim) {
    var rows = [], row = [], cell = '', q = false;
    text = String(text || '').replace(/^\uFEFF/, '');
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function guessDelim(text) {
    var sample = text.slice(0, 4000).split('\n').slice(0, 25).join('\n');
    var tabs = (sample.match(/\t/g) || []).length, commas = (sample.match(/,/g) || []).length;
    return tabs > commas && tabs > 3 ? '\t' : ',';
  }

  function clean(s) { return String(s == null ? '' : s).replace(/^\uFEFF/, '').trim(); }

  /* ---------- 表头定位：跳过导出信息、姓名、统计说明、分隔线 ---------- */
  function findHeader(rows) {
    var limit = Math.min(rows.length, 60);
    for (var i = 0; i < limit; i++) {
      var cells = rows[i].map(clean).filter(function (x) { return x; });
      if (cells.length < 3) continue;
      var j = cells.join('|');
      if (!/金额|发生额|交易额/.test(j)) continue;
      if (!/交易时间|交易创建时间|付款时间|交易日期|日期|时间/.test(j)) continue;
      if (/导出信息|证件|账号：|昵称：|起始时间/.test(j)) continue;
      return { index: i, cells: rows[i].map(clean) };
    }
    return null;
  }
  function pickCol(head, tests) {
    for (var k = 0; k < tests.length; k++) {
      for (var i = 0; i < head.length; i++) {
        if (tests[k].test(head[i])) return i;
      }
    }
    return -1;
  }
  var COLS = {
    date: [/^交易时间$/, /^交易创建时间$/, /^付款时间$/, /^交易日期$/, /^日期$/, /交易(创建)?时间/, /时间/, /日期/],
    amount: [/^金额(\(元\)|（元）)?$/, /金额/, /发生额/, /交易额/],
    dir: [/收\s*[\/\\]\s*支/, /收\s*支/, /收支/, /^方向$/],
    counterparty: [/交易对方/, /对方名称/, /^对方$/, /商户名称/, /收款方/, /付款方/],
    product: [/商品说明/, /商品名称/, /^商品$/, /摘要/, /商品/, /交易备注/],
    status: [/当前状态/, /交易状态/, /^状态$/, /资金状态/],
    order: [/^交易单号$/, /^交易订单号$/, /^交易号$/, /订单号/, /商户单号/],
    pay: [/支付方式/, /收\/付款方式/, /付款方式/, /收\/支方式/],
    cat: [/交易分类/, /^分类$/, /业务类型/, /交易类型/, /类型/]
  };

  function parseMoney(s) {
    var t = clean(s).replace(/[¥￥,，\s元]/g, '');
    if (!t || t === '/' || t === '-') return NaN;
    var v = parseFloat(t);
    return isFinite(v) ? Math.abs(Math.round(v * 100) / 100) : NaN;
  }
  function parseDate(raw) {
    var s = clean(raw), m = s.match(/(\d{4})\s*[-\/年.]\s*(\d{1,2})\s*[-\/月.]\s*(\d{1,2})/);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var t = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    var hh = t ? Math.min(23, +t[1]) : 12, mm = t ? Math.min(59, +t[2]) : 0;

      date: y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'),

  }
  function guessCategory(text, type, official) {
    var s = String(text || '').toLowerCase();
    /* 官方账单自带的分类名，若能直接对上账本分类就优先采用 */
    for (var i = 0; i < (official || []).length; i++) {
      var n = official[i];
      if (n.length >= 2 && s.indexOf(n) >= 0) return n;
    }
    var rules = type === 'income' ? INCOME_RULES : EXPENSE_RULES;
    for (var r = 0; r < rules.length; r++) {
      for (var k = 0; k < rules[r][1].length; k++) {
        if (s.indexOf(rules[r][1][k]) >= 0) return rules[r][0];
      }
    }
    return '其他';

function accById(id) { return D().accounts.find(function (a) { return a.id === id; }) || null; }
function catName(id) { var c = catById(id); return c ? c.name : (id ? '未分类' : '转账'); }
function catIcon(id) { var c = catById(id); return c ? c.icon : '🔁'; }
function accName(id) { var a = accById(id); return a ? a.name : '未知账户'; }
function allTxns() { return D().txns; }
function txnsInMonth(m) { return D().txns.filter(function (t) { return monthOf(t.date) === m; }); }
function txnsInYear(y) { return D().txns.filter(function (t) { return t.date.slice(0, 4) === String(y); }); }
function sumOf(list) {
  var r = { income: 0, expense: 0, transfer: 0, net: 0, count: list.length };
  list.forEach(function (t) {
    if (t.type === 'income') r.income += t.amount;
    else if (t.type === 'expense') r.expense += t.amount;
    else r.transfer += t.amount;
  });
  r.net = r.income - r.expense;
  return r;
}
function accountBalance(id) {
  var a = accById(id);
  if (!a) return 0;
  var bal = num(a.initial);
  D().txns.forEach(function (t) {
    if (t.type === 'income' && t.accountId === id) bal += t.amount;
    else if (t.type === 'expense' && t.accountId === id) bal -= t.amount;
    else if (t.type === 'transfer') {
      if (t.accountId === id) bal -= t.amount;
      if (t.toAccountId === id) bal += t.amount;
    }
  });
  return round2(bal);
}
function netWorth() { return round2(D().accounts.filter(function (a) { return !a.archived; }).reduce(function (s, a) { return s + accountBalance(a.id); }, 0)); }
function spendByCat(list, type) {
  var map = {};
  list.forEach(function (t) {
    if (t.type !== type) return;
    var k = t.categoryId || 'none';
    map[k] = (map[k] || 0) + t.amount;
  });
  return Object.keys(map).map(function (k) {
    var c = catById(k);
    return { id: k, name: c ? c.name : '未分类', icon: c ? c.icon : '❓', color: c ? c.color : '#94a3b8', value: round2(map[k]) };
  }).sort(function (a, b) { return b.value - a.value; });
}
function budgetOf(m) { return D().budgets[m] || null; }
function monthList(n) {
  var out = [];
  for (var i = n - 1; i >= 0; i--) out.push(shiftMonth(state.month, -i));
  return out;
}
function lastNMonths(n) {
  var out = [];
  for (var i = n - 1; i >= 0; i--) out.push(shiftMonth(curMonth(), -i));
  return out;
}
function changePct(now, prev) {
  if (!prev) return now ? 100 : 0;
  return ((now - prev) / Math.abs(prev)) * 100;
}
function trendPill(now, prev, invert) {
  if (!prev) return '<span class="badge">暂无对比</span>';
  var d = changePct(now, prev);
  var good = invert ? d < 0 : d > 0;
  var cls = Math.abs(d) < 0.5 ? '' : (good ? 'pos' : 'neg');
  var icon = d >= 0 ? 'i-arrow-up' : 'i-arrow-down';
  return '<span class="trend-pill ' + cls + '"><svg class="ic"><use href="#' + icon + '"/></svg>' + Math.abs(d).toFixed(1) + '%</span><span>较上月</span>';
}
function activeTags() {
  var m = {};
  D().txns.forEach(function (t) { (t.tags || []).forEach(function (x) { m[x] = (m[x] || 0) + 1; }); });
  return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).slice(0, 10);
}
function ensureRecurring() {
  var m = curMonth(), today = new Date().getDate(), changed = false;
  D().recurring.forEach(function (r) {
    if (!r.enabled) return;
    if (!Array.isArray(r.generated)) r.generated = [];
    if (r.generated.indexOf(m) >= 0) return;
    if (today < (+r.day || 1)) return;
    var day = Math.min(+r.day || 1, daysInMonth(m));
    D().txns.push({
      id: uid(), type: r.type, amount: num(r.amount), categoryId: r.categoryId || '',
      accountId: r.accountId, toAccountId: r.toAccountId || '', date: m + '-' + pad2(day),
      time: '08:00', note: r.note || '周期记账', tags: ['周期'], recurringId: r.id
    });
    r.generated.push(m);
    changed = true;
  });
  if (changed) save();
}

/* ---------- 主题 / 提示 ---------- */
function applyTheme() {
  var t = D().settings.theme || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var btn = $('#themeToggle');
  if (btn) $('use', btn).setAttribute('href', t === 'dark' ? '#i-moon' : '#i-sun');
}
function applyPrivacyBtn() {
  var btn = $('#privacyToggle');
  if (btn) {
    $('use', btn).setAttribute('href', privacy() ? '#i-eye-off' : '#i-eye');
    btn.title = privacy() ? '显示金额 (H)' : '隐藏金额 (H)';
  }
}
function toast(msg, isErr, action) {
  var root = $('#toastRoot');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.innerHTML = '<svg class="ic"><use href="#' + (isErr ? 'i-info' : 'i-check') + '"/></svg><span>' + esc(msg) + '</span>'
    + (action ? '<button data-act="' + action + '">撤销</button>' : '');
  root.appendChild(el);
  setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 240); }, action ? 5200 : 2600);
}

</script>
<script>
/* ============ 视图渲染 ============ */
var VIEW_META = {
  dashboard: ['总览', '一眼看清这个月的钱都去哪了'],
  transactions: ['明细', '每一笔都查得到、改得动'],
  budget: ['预算与目标', '给花钱设个边界，给存钱定个方向'],
  accounts: ['账户', '现金、银行卡、信用卡，余额自动对账'],
  reports: ['报表', '把散落的流水变成看得懂的结论'],
  settings: ['设置', '分类、周期记账、数据备份都在这里']
};
function icon(id, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '"><use href="#' + id + '"/></svg>'; }
function cardHead(title, sub, actions) {
  return '<div class="card-head"><div><h3>' + title + '</h3>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (actions ? '<div class="card-head-actions">' + actions + '</div>' : '') + '</div>';
}
function emptyHtml(title, desc, ico, btn) {
  return '<div class="empty"><div class="empty-icon">' + icon(ico || 'i-info') + '</div><strong>' + title + '</strong>'
    + '<div>' + (desc || '') + '</div>' + (btn || '') + '</div>';
}
function optCats(type, sel, withAll) {
  var s = withAll ? '<option value="all">全部分类</option>' : '';
  D().categories.filter(function (c) { return !type || c.type === type; }).forEach(function (c) {
    s += '<option value="' + c.id + '"' + (sel === c.id ? ' selected' : '') + '>' + esc(c.icon + ' ' + c.name) + '</option>';
  });
  return s;
}
function optAccounts(sel, withAll, skipId) {
  var s = withAll ? '<option value="all">全部账户</option>' : '';
  D().accounts.filter(function (a) { return a.id !== skipId; }).forEach(function (a) {
    s += '<option value="' + a.id + '"' + (sel === a.id ? ' selected' : '') + '>' + esc(a.icon + ' ' + a.name) + '</option>';
  });
  return s;
}

/* ---------- 交易行 ---------- */
function txnRowHtml(t) {
  var tr = t.type === 'transfer';
  var title = t.note || (tr ? '账户转账' : catName(t.categoryId));
  var ico = tr ? '🔁' : catIcon(t.categoryId);
  var parts = [tr ? (accName(t.accountId) + ' → ' + accName(t.toAccountId)) : (catName(t.categoryId) + ' · ' + accName(t.accountId)), t.time];
  var tags = (t.tags || []).map(function (x) { return '<span class="tag-pill">' + esc(x) + '</span>'; }).join('');
  var value = tr ? money(t.amount) : signedMoney(t.type === 'expense' ? -t.amount : t.amount);
  var cls = tr ? 'transfer' : (t.type === 'expense' ? 'neg' : 'pos');
  var color = tr ? 'var(--transfer)' : (t.type === 'expense' ? 'var(--expense)' : 'var(--income)');
  return '<div class="txn-row">'
    + '<div class="txn-ico" style="border-color:' + (tr ? 'var(--line)' : colorOf(t.categoryId)) + '33">' + ico + '</div>'
    + '<div class="txn-main"><div class="txn-title">' + esc(title) + '</div>'
    + '<div class="txn-sub"><span>' + esc(parts[0]) + '</span><span class="dot">·</span><span>' + esc(parts[1]) + '</span>' + tags + '</div></div>'
    + '<div class="txn-amount ' + cls + '">' + amt(value) + '</div>'
    + '<div class="row-actions">'
    + '<button class="icon-btn" data-act="edit-txn" data-id="' + t.id + '" title="编辑">' + icon('i-edit') + '</button>'
    + '<button class="icon-btn danger" data-act="del-txn" data-id="' + t.id + '" title="删除">' + icon('i-trash') + '</button>'
    + '</div></div>';
}
function txnGroupHtml(list, showDate) {
  if (!list.length) return '';
  var groups = {}, order = [];
  list.forEach(function (t) { if (!groups[t.date]) { groups[t.date] = []; order.push(t.date); } groups[t.date].push(t); });
  return order.map(function (day) {
    var arr = groups[day].sort(function (a, b) { return b.time.localeCompare(a.time); });
    var s = sumOf(arr);
    var wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(day + 'T12:00:00').getDay()];
    return '<div class="day-group"><div class="day-head"><span>' + (+day.slice(5, 7)) + ' 月 ' + (+day.slice(8, 10)) + ' 日 · ' + wd + '</span>'
      + '<span>支出 ' + amt(money(s.expense)) + (s.income ? ' · 收入 ' + amt(money(s.income)) : '') + '</span></div>'
      + arr.map(txnRowHtml).join('') + '</div>';
  }).join('');
}

/* ---------- 图表组件 ---------- */
function chartLegend() {
  return '<div class="chart-legend"><span><i style="background:var(--income)"></i>收入</span><span><i style="background:var(--expense)"></i>支出</span></div>';
}
function spendInsightHtml(cats, s, prev) {
  if (!cats.length) return '';
  var n = txnsInMonth(state.month).filter(function (t) { return t.type === 'expense'; }).length;
  var top = cats[0], delta = changePct(s.expense, prev.expense);
  return '<div class="divider" style="margin:16px 0 14px"></div><div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">'
    + '<div class="kpi"><div class="k-label">最大开销</div><div class="k-value">' + esc(top.icon + ' ' + top.name) + '</div>'
    + '<div class="k-foot">' + amt(money(top.value, 0)) + ' · 占 ' + pct(top.value, s.expense || 1).toFixed(0) + '%</div></div>'
    + '<div class="kpi"><div class="k-label">笔均支出</div><div class="k-value">' + amt(money(s.expense / Math.max(1, n), 0)) + '</div>'
    + '<div class="k-foot">共 ' + n + ' 笔 · 环比 ' + (delta >= 0 ? '+' : '') + delta.toFixed(0) + '%</div></div>'
    + '</div>';
}
function trendSummaryHtml(months) {
  if (!months.length) return '';
  var ex = months.map(function (m) { return m.expense; });
  if (ex.every(function (v) { return v === 0; })) {
    return '<div class="divider" style="margin:10px 0 14px"></div>'
      + '<div class="tiny muted" style="text-align:center;padding:14px 0">还没有支出记录 · 记几笔后，这里会出现月均支出、最省月份与累计结余</div>';
  }
  var max = Math.max.apply(null, ex), min = Math.min.apply(null, ex);
  var avg = ex.reduce(function (a, b) { return a + b; }, 0) / ex.length;
  var net = months.reduce(function (a, m) { return a + m.income - m.expense; }, 0);
  return '<div class="divider" style="margin:10px 0 14px"></div><div class="kpi-grid">'
    + '<div class="kpi"><div class="k-label">月均支出</div><div class="k-value">' + amt(money(avg, 0)) + '</div><div class="k-foot">近 ' + months.length + ' 个月</div></div>'
    + '<div class="kpi"><div class="k-label">最省的一个月</div><div class="k-value">' + esc(months[ex.indexOf(min)].label) + ' · ' + amt(money(min, 0)) + '</div><div class="k-foot">最多 ' + amt(money(max, 0)) + '</div></div>'
    + '<div class="kpi"><div class="k-label">半年累计结余</div><div class="k-value ' + (net >= 0 ? 'pos' : 'neg') + '">' + amt(money(net, 0)) + '</div><div class="k-foot">收入减支出</div></div>'
    + '</div>';
}
function donutCardHtml(items, total, label, centerText) {
  var top = items.slice(0, 6);
  if (items.length > 6) {
    var rest = items.slice(6).reduce(function (s, x) { return s + x.value; }, 0);
    top.push({ name: '其他', value: rest, color: '#94a3b8' });
  }
  var legend = top.map(function (d) {
    return '<div class="cat-legend-row"><i style="background:' + d.color + '"></i>'
      + '<span class="cl-name">' + esc(d.icon ? d.icon + ' ' : '') + esc(d.name) + '</span>'
      + '<span class="cl-val">' + amt(money(d.value, 0)) + '<span class="cl-pct">' + pct(d.value, total || 1).toFixed(0) + '%</span></span></div>';
  }).join('');
  return '<div class="donut-wrap"><div class="donut-box">' + Charts.donut(top)
    + '<div class="donut-center"><div class="dc-label">' + label + '</div><div class="dc-value">' + amt(centerText || money(total, 0)) + '</div></div></div>'
    + '<div class="cat-legend">' + (legend || '<span class="muted tiny">暂无数据</span>') + '</div></div>';
}
function heatmapHtml(m) {
  var list = txnsInMonth(m).filter(function (t) { return t.type === 'expense'; });
  var byDay = {}, cnt = {};
  list.forEach(function (t) { byDay[t.date] = (byDay[t.date] || 0) + t.amount; cnt[t.date] = (cnt[t.date] || 0) + 1; });
  var vals = Object.keys(byDay).map(function (k) { return byDay[k]; });
  var max = Math.max.apply(null, vals.concat([1]));
  var first = (new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).getDay() + 6) % 7;
  var dim = daysInMonth(m), today = todayStr();
  var s = '<div class="heat-cal">';
  ['一', '二', '三', '四', '五', '六', '日'].forEach(function (w) { s += '<div class="heat-week">' + w + '</div>'; });
  for (var i = 0; i < first; i++) s += '<div class="heat-cell blank"></div>';
  for (var d = 1; d <= dim; d++) {
    var key = m + '-' + pad2(d), v = byDay[key] || 0, ratio = v / max;
    var bg = v ? 'color-mix(in srgb, var(--expense) ' + (8 + ratio * 62).toFixed(0) + '%, var(--surface-2))' : 'var(--surface-2)';
    s += '<div class="heat-cell' + (key === today ? ' today' : '') + '" style="background:' + bg + '" title="' + d + ' 日支出 ' + money(v) + ' · ' + (cnt[key] || 0) + ' 笔">' + d + '</div>';
  }
  return s + '</div>';
}

/* ---------- 总览 ---------- */
function welcomeHtml() {
  return '<div class="card welcome-card"><div class="wc-ico">' + icon('i-spark') + '</div>'
    + '<div style="flex:1;min-width:0"><div class="wc-title">账本还是空的，从第一笔开始</div>'
    + '<div class="wc-desc">这里不预置任何金额，所有数字都由你亲自记录；数据只存在这台设备，不上传、不同步。</div></div>'
    + '<button class="btn btn-primary" data-act="add-txn">' + icon('i-plus') + '记第一笔</button></div>';
}
function demoBannerHtml() {
  return '<div class="demo-banner">' + icon('i-info')
    + '<div><strong>虚构示例数据</strong> · 下面的金额都是随机生成的，不是真实账目，别拿它记账。</div>'
    + '<button class="btn btn-sm" data-act="clear-demo">一键清空</button></div>';
}
function statCard(label, ico, value, foot, cls, glow) {
  return '<div class="card stat-card ' + (cls || '') + '" style="--glow:' + (glow || 'rgba(94,224,160,.16)') + '">'
    + '<div class="stat-label">' + icon(ico) + label + '</div>'
    + '<div class="stat-value">' + value + '</div><div class="stat-foot">' + foot + '</div></div>';
}
function viewDashboard() {
  var m = state.month, list = txnsInMonth(m), s = sumOf(list), prev = sumOf(txnsInMonth(shiftMonth(m, -1)));
  var cats = spendByCat(list, 'expense');
  var b = budgetOf(m);
  var recent = list.slice().sort(function (a, b2) { return (b2.date + b2.time).localeCompare(a.date + a.time); }).slice(0, 6);
  var months = lastNMonths(6).map(function (x) {
    var ss = sumOf(txnsInMonth(x));
    return { label: monthShort(x), income: ss.income, expense: ss.expense };
  });
  var h = (D().txns.length === 0 && !D().settings.demo ? welcomeHtml() : '')
    + '<div class="grid g-4">'
    + statCard('本月支出', 'i-arrow-down', mA(s.expense), trendPill(s.expense, prev.expense, true), '', 'rgba(255,125,142,.16)')
    + statCard('本月收入', 'i-arrow-up', mA(s.income), trendPill(s.income, prev.income, false), '', 'rgba(74,222,159,.16)')
    + statCard('本月结余', 'i-spark', mA(s.net), '<span>' + (s.income ? '储蓄率 ' + (pct(s.net, s.income)).toFixed(0) + '%' : '暂无收入') + '</span><span>·</span><span>' + list.length + ' 笔流水</span>', 'hero')
    + statCard('总资产', 'i-wallet', mA(netWorth()), '<span>' + D().accounts.filter(function (a) { return !a.archived; }).length + ' 个账户合计</span><span>·</span><button class="btn btn-ghost btn-sm" data-act="goto" data-view="accounts" style="padding:0 4px">查看明细 →</button>', '', 'rgba(138,150,255,.16)')
    + '</div>';

  h += '<div class="grid g-2-1" style="margin-top:16px">';
  var hasTrend = months.some(function (x) { return x.income > 0 || x.expense > 0; });
  h += '<div class="card">' + cardHead('收支趋势', '近 6 个月的收入与支出', chartLegend())
    + (hasTrend ? Charts.bars(months) + trendSummaryHtml(months) : emptyHtml('还没有收支数据', '记下第一笔，趋势就会长出来', 'i-chart')) + '</div>';
  // 预算卡
  var bHtml = '';
  if (!b || !b.total) {
    bHtml = emptyHtml('还没设置本月预算', '设个上限，花起来心里有数', 'i-target', '<button class="btn btn-primary btn-sm" data-act="edit-budget">设置预算</button>');
  } else {
    var used = s.expense, p = pct(used, b.total), left = b.total - used;
    var dim = daysInMonth(m), passed = (m === curMonth() ? new Date().getDate() : dim), restDays = Math.max(1, dim - passed + (m === curMonth() ? 0 : 0));
    bHtml = '<div class="progress-line"><span class="pl-name">本月总预算 ' + amt(money(b.total, 0)) + '</span>'
      + '<span class="pl-amt">' + p.toFixed(0) + '% · 已用 ' + amt(money(used, 0)) + '</span></div>'
      + '<div class="progress-track"><div class="progress-fill' + (p > 100 ? ' over' : '') + '" style="width:' + clamp(p, 0, 100) + '%;background:' + (p > 90 ? 'var(--warn)' : 'var(--accent)') + '"></div></div>'
      + '<div class="kpi-grid" style="margin-top:16px">'
      + '<div class="kpi"><div class="k-label">' + (left >= 0 ? '剩余可用' : '已超支') + '</div><div class="k-value ' + (left >= 0 ? 'pos' : 'neg') + '">' + amt(money(Math.abs(left), 0)) + '</div></div>'
      + '<div class="kpi"><div class="k-label">' + (m === curMonth() ? '接下来每天可花' : '当月日均支出') + '</div><div class="k-value">' + amt(money(m === curMonth() ? Math.max(0, left) / restDays : used / dim, 0)) + '</div></div>'
      + '</div>'
      + (function () {
        var bs = Object.keys(b.cats || {}).filter(function (id) { return b.cats[id] > 0; });
        if (!bs.length) return '<div class="tiny muted" style="margin-top:14px">尚未设置分类预算 · <button class="btn btn-ghost btn-sm" data-act="edit-budget" style="padding:2px 6px">去设置</button></div>';
        return '<div class="divider"></div>' + bs.slice(0, 3).map(function (id) {
          var spent = (cats.find(function (c) { return c.id === id; }) || { value: 0 }).value;
          var pp = pct(spent, b.cats[id]);
          return '<div class="budget-item"><div class="progress-line"><span class="pl-name">' + esc(catIcon(id) + ' ' + catName(id)) + '</span><span class="pl-amt">' + amt(money(spent, 0)) + ' / ' + amt(money(b.cats[id], 0)) + '</span></div>'
            + '<div class="progress-track"><div class="progress-fill' + (pp > 100 ? ' over' : '') + '" style="width:' + clamp(pp, 0, 100) + '%;background:' + colorOf(id) + '"></div></div></div>';
        }).join('');
      })()
      + '<button class="btn btn-sm" data-act="edit-budget" style="margin-top:16px;width:100%">调整预算</button>';
  }
  h += '<div class="card">' + cardHead('本月预算', monthCN(m), '<button class="icon-btn sm" data-act="edit-budget" title="设置预算">' + icon('i-edit') + '</button>') + bHtml + '</div>';
  h += '</div>';

  h += '<div class="grid g-2" style="margin-top:16px">';
  h += '<div class="card">' + cardHead('支出结构', '本月钱都花在哪些地方') + (cats.length ? donutCardHtml(cats, s.expense, '本月支出', money(s.expense, 0)) + spendInsightHtml(cats, s, prev) : emptyHtml('本月还没有支出', '记一笔就能看到结构', 'i-chart')) + '</div>';
  h += '<div class="card">' + cardHead('每日支出', '颜色越深，那天花得越多', '<span class="badge">' + list.filter(function (t) { return t.type === 'expense'; }).length + ' 笔支出</span>') + heatmapHtml(m) + '</div>';
  h += '</div>';

  h += '<div class="section-title"><h2>最近流水</h2><button class="btn btn-sm btn-ghost" data-act="goto" data-view="transactions">查看全部 ' + icon('i-right') + '</button></div>';

/* ---------- 明细 ---------- */
function filteredTxns() {
  var f = state.filters;
  var q = f.q.trim().toLowerCase();
  return D().txns.filter(function (t) {
    if (f.scope === 'month' && monthOf(t.date) !== state.month) return false;
    if (f.type !== 'all' && t.type !== f.type) return false;
    if (f.cat !== 'all' && t.categoryId !== f.cat) return false;
    if (f.acc !== 'all' && t.accountId !== f.acc && t.toAccountId !== f.acc) return false;
    if (q) {
      var hay = [t.note, catName(t.categoryId), accName(t.accountId), (t.tags || []).join(' '), String(t.amount), t.date].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); });
}
function txnListHtml() {
  var list = filteredTxns();
  var shown = list.slice(0, 60 + state.txnPage * 60);

}

    + '<div class="setting-row"><div><div class="sr-title">金额隐私模式</div><div class="sr-desc">一键模糊所有金额，适合在别人面前打开</div></div><div class="sr-ctrl"><button class="switch' + (st.privacy ? ' on' : '') + '" data-act="toggle-privacy" aria-label="隐私模式"></button></div></div>'

  h += '<div class="card">' + cardHead('数据管理', '你的数据完全在本机，建议偶尔备份')
    + '<div class="setting-row"><div><div class="sr-title">完整备份（JSON）</div><div class="sr-desc">包含账户、分类、预算、目标、周期规则</div></div><div class="sr-ctrl"><button class="btn btn-sm" data-act="export-json">' + icon('i-download') + '导出</button><button class="btn btn-sm" data-act="import-json">' + icon('i-upload') + '导入</button></div></div>'

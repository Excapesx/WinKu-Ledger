    + '<div class="setting-row"><div><div class="sr-title">虚构示例数据 <span class="badge warn">非真实账目</span></div><div class="sr-desc">' + (st.demo ? '当前显示的是随机生成的示例，建议清空后开始记真账' : '默认不生成任何数字；想预览界面效果可手动载入') + '</div></div><div class="sr-ctrl">'
    + (st.demo ? '<button class="btn btn-sm" data-act="clear-demo">清空示例数据</button>' : '<button class="btn btn-sm" data-act="load-demo">载入虚构示例</button>') + '</div></div>'
    + '<div class="setting-row"><div><div class="sr-title">清空全部数据</div><div class="sr-desc">不可撤销，请先导出备份</div></div><div class="sr-ctrl"><button class="btn btn-sm btn-danger" data-act="wipe">' + icon('i-trash') + '清空</button></div></div>'
    + '</div></div>';

  h += '<div class="grid g-2" style="margin-top:16px">';
  ['expense', 'income'].forEach(function (type) {
    h += '<div class="card">' + cardHead(type === 'expense' ? '支出分类' : '收入分类', '点图标可改名称、图标和颜色',
      '<button class="btn btn-sm btn-primary" data-act="edit-cat" data-type="' + type + '">' + icon('i-plus') + '新增</button>')
      + D().categories.filter(function (c) { return c.type === type; }).map(function (c) {
        var used = D().txns.filter(function (t) { return t.categoryId === c.id; }).length;
        return '<div class="manage-row"><div class="mr-ico" style="border-color:' + c.color + '44">' + esc(c.icon) + '</div>'
          + '<div class="mr-name">' + esc(c.name) + '<div class="tiny muted" style="font-weight:400">' + used + ' 笔流水</div></div>'
          + '<span class="badge" style="background:' + c.color + '22;color:' + c.color + '">' + esc(c.name.slice(0, 2)) + '</span>'
          + '<button class="icon-btn sm" data-act="edit-cat" data-id="' + c.id + '">' + icon('i-edit') + '</button>'
          + '<button class="icon-btn sm danger" data-act="del-cat" data-id="' + c.id + '">' + icon('i-trash') + '</button></div>';
      }).join('') + '</div>';
  });
  h += '</div>';

  h += '<div class="section-title"><h2>周期记账</h2><button class="btn btn-primary btn-sm" data-act="edit-recurring">' + icon('i-plus') + '新增规则</button></div>';
  var rec = D().recurring;
  h += '<div class="card">' + (rec.length ? rec.map(function (r) {
    return '<div class="manage-row"><div class="mr-ico">' + catIcon(r.categoryId) + '</div>'
      + '<div class="mr-name">' + esc(r.note || catName(r.categoryId)) + '<div class="tiny muted" style="font-weight:400">每月 ' + r.day + ' 日 · ' + esc(accName(r.accountId)) + ' · ' + (r.type === 'income' ? '收入' : '支出') + '</div></div>'
      + '<span class="badge ' + (r.type === 'income' ? 'good' : '') + '">' + amt(money(r.amount, 0)) + '</span>'
      + '<button class="switch' + (r.enabled ? ' on' : '') + '" data-act="toggle-recurring" data-id="' + r.id + '" title="启用/停用" style="transform:scale(.85)"></button>'
      + '<button class="icon-btn sm" data-act="edit-recurring" data-id="' + r.id + '">' + icon('i-edit') + '</button>'
      + '<button class="icon-btn sm danger" data-act="del-recurring" data-id="' + r.id + '">' + icon('i-trash') + '</button></div>';
  }).join('') : emptyHtml('还没有周期规则', '房租、工资、会员订阅这类固定收支，可以自动记账', 'i-repeat'))
    + '</div>';

  h += '<div class="card" style="margin-top:16px">' + cardHead('关于这个工作台', '本地版 · 零依赖 · 离线可用')
    + '<div class="tiny muted" style="line-height:1.9">'
    + '· 所有数据保存在当前浏览器的 localStorage（' + esc(location.protocol === 'file:' ? '本地文件模式' : location.host || '本机') + '），不会上传任何服务器，也不需要账号。<br>'
    + '· 换浏览器、清缓存或使用无痕模式会导致数据不可见，重要数据请定期用「完整备份」导出 JSON。<br>'
    + '· 快捷键：<kbd>N</kbd> 记一笔 · <kbd>/</kbd> 搜索 · <kbd>H</kbd> 隐藏金额 · <kbd>T</kbd> 切主题 · <kbd>←</kbd><kbd>→</kbd> 切换月份 · <kbd>Esc</kbd> 关闭弹窗。<br>'
    + '· 金额框支持简单算式，例如输入 <code>35+12.5</code> 会自动算成 47.50。'
    + '</div></div>';
  return h;
}

/* ---------- 统一渲染 ---------- */
function renderView(keepFocus) {
  var meta = VIEW_META[state.view] || VIEW_META.dashboard;
  $('#viewTitle').textContent = meta[0];
  $('#viewSubtitle').textContent = meta[1];
  $('#monthLabel').textContent = monthCN(state.month);
  $('#monthPicker').style.display = (state.view === 'reports' || state.view === 'settings') ? 'none' : '';
  $$('.nav-item').forEach(function (b) { b.classList.toggle('active', b.dataset.view === state.view); });
  var fn = { dashboard: viewDashboard, transactions: viewTransactions, budget: viewBudget, accounts: viewAccounts, reports: viewReports, settings: viewSettings }[state.view];
  var box = $('#content');
  box.innerHTML = (D().settings.demo ? demoBannerHtml() : '') + fn();
  if (!keepFocus) { box.style.animation = 'none'; void box.offsetWidth; box.style.animation = ''; }
  applyTheme(); applyPrivacyBtn();
}

</script>
<script>
/* ============ 交互：弹窗、表单、事件、导入导出、启动 ============ */
var modalCtx = { type: 'expense', catId: '', editId: null };
var pendingConfirm = null, pendingImport = null, undoStack = null;
var billRaw = [];        // 本次选中的账单文件原文（可多选，微信 + 支付宝混着来）
var billPending = null;  // 解析并去重后的待导入结果

/* ---------- 弹窗基础 ---------- */
function openModal(html, wide, onMount) {
  var root = $('#modalRoot');
  root.innerHTML = '<div class="modal-backdrop" data-act="backdrop"><div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div></div>';
  document.body.style.overflow = 'hidden';
  if (onMount) onMount(root);
  var f = root.querySelector('[autofocus]');
  if (f) setTimeout(function () { f.focus(); f.select && f.select(); }, 40);
}
function closeModal() {
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
  pendingConfirm = null;
  modalCtx.editId = null;
}
function modalHead(title, sub) {
  return '<div class="modal-head"><div><h3>' + title + '</h3>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>'
    + '<button class="icon-btn" data-act="close-modal" title="关闭">' + icon('i-close') + '</button></div>';
}
function modalFoot(left, right) {
  return '<div class="modal-foot">' + (left ? '<div class="left">' + left + '</div>' : '')
    + '<button type="button" class="btn" data-act="close-modal">取消</button>' + right + '</div>';
}
function confirmDialog(title, desc, fn, danger) {
  pendingConfirm = fn;
  openModal(modalHead(title, '') + '<div class="modal-body"><div class="tiny" style="color:var(--text-2);line-height:1.8">' + desc + '</div></div>'
    + '<div class="modal-foot"><button type="button" class="btn" data-act="close-modal">再想想</button>'
    + '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-act="confirm-yes">确定</button></div>');
}
function emojiPicker(sel) {
  return '<div class="icon-grid">' + EMOJIS.map(function (x) {
    return '<button type="button" class="' + (x === sel ? 'active' : '') + '" data-act="pick-emoji" data-val="' + x + '">' + x + '</button>';
  }).join('') + '</div>';
}
function colorPicker(sel) {
  return '<div class="color-grid">' + PALETTE.map(function (x) {
    return '<button type="button" class="' + (x === sel ? 'active' : '') + '" data-act="pick-color" data-val="' + x + '" style="background:' + x + '"></button>';
  }).join('') + '</div>';
}
function catPickerHtml(type, sel) {
  return D().categories.filter(function (c) { return c.type === type; }).map(function (c) {
    return '<button type="button" class="cat-opt' + (sel === c.id ? ' active' : '') + '" data-act="pick-cat" data-id="' + c.id + '">'
      + '<span class="emoji">' + esc(c.icon) + '</span><span>' + esc(c.name) + '</span></button>';
  }).join('');
}
function setPickerValue(root, sel, val) {
  var inp = $(sel, root);
  if (inp) inp.value = val;
  $$('[data-act="' + (sel === '#pickIcon' ? 'pick-emoji' : 'pick-color') + '"]', root).forEach(function (b) { b.classList.toggle('active', b.dataset.val === val); });
}

/* ---------- 记一笔 / 编辑流水 ---------- */
function openTxnModal(id) {
  if (!D().accounts.length) { toast('请先在「账户」里添加一个账户', true); goView('accounts'); return; }
  var t = id ? D().txns.find(function (x) { return x.id === id; }) : null;
  modalCtx.editId = id || null;
  modalCtx.type = t ? t.type : 'expense';
  var cats = D().categories.filter(function (c) { return c.type === modalCtx.type; });
  modalCtx.catId = t ? t.categoryId : (cats[0] ? cats[0].id : '');
  var today = new Date();
  var date = t ? t.date : (state.month === curMonth() ? todayStr() : state.month + '-' + pad2(Math.min(today.getDate(), daysInMonth(state.month))));
  var time = t ? t.time : pad2(today.getHours()) + ':' + pad2(today.getMinutes());
  var tags = activeTags();
  var body = ''
    + '<div class="seg" style="margin-bottom:14px">'
    + [['expense', '支出'], ['income', '收入'], ['transfer', '转账']].map(function (x) {
      return '<button type="button" class="' + (modalCtx.type === x[0] ? 'active' : '') + '" data-type="' + x[0] + '" data-act="txn-type" data-val="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>'
    + '<div class="field"><label>金额 <span class="hint">支持算式，如 35+12.5</span></label><div class="amount-wrap"><span class="cur">' + esc(cur()) + '</span>'
    + '<input class="amount-input" name="amount" autofocus inputmode="decimal" placeholder="0.00" value="' + (t ? t.amount : '') + '"></div></div>'
    + '<div class="field" id="catField"><label>分类</label><div class="cat-picker" id="catPicker">' + catPickerHtml(modalCtx.type, modalCtx.catId) + '</div>'
    + '<input type="hidden" name="catId" id="catId" value="' + modalCtx.catId + '"></div>'
    + '<div class="field-row">'
    + '<div class="field"><label>' + (modalCtx.type === 'transfer' ? '转出账户' : '账户') + '</label><select name="accountId">' + optAccounts(t ? t.accountId : D().accounts[0].id, false) + '</select></div>'
    + '<div class="field" id="toField" style="' + (modalCtx.type === 'transfer' ? '' : 'display:none') + '"><label>转入账户</label><select name="toAccountId">' + optAccounts(t ? t.toAccountId : (D().accounts[1] || D().accounts[0]).id, false) + '</select></div>'
    + '</div>'
    + '<div class="field-row"><div class="field"><label>日期</label><input type="date" name="date" value="' + date + '"></div>'
    + '<div class="field"><label>时间</label><input type="time" name="time" value="' + time + '"></div></div>'
    + '<div class="field"><label>备注</label><input name="note" placeholder="花在什么上了？" maxlength="60" value="' + esc(t ? t.note : '') + '"></div>'
    + '<div class="field"><label>标签 <span class="hint">用空格或逗号分隔，方便以后筛选</span></label>'
    + '<input name="tags" placeholder="例如：必需 可省 报销" value="' + esc(t ? (t.tags || []).join(' ') : '') + '">'
    + (tags.length ? '<div class="suggest-tags">' + tags.slice(0, 7).map(function (x) { return '<button type="button" data-act="add-tag" data-val="' + esc(x) + '">#' + esc(x) + '</button>'; }).join('') + '</div>' : '')
    + '</div>'
    + '<label class="checkbox-line"><input type="checkbox" name="makeRecurring" ' + (t ? 'disabled' : '') + '> 同时设为每月固定收支（周期记账）</label>';
  var foot = modalFoot(
    t ? '<button type="button" class="btn btn-danger btn-sm" data-act="del-txn" data-id="' + t.id + '">' + icon('i-trash') + '删除</button>'
      : '<label class="checkbox-line"><input type="checkbox" name="keepOpen" checked> 保存后继续记</label>',
    '<button type="submit" class="btn btn-primary">' + icon('i-check') + (t ? '保存修改' : '记下来') + '</button>');
  openModal('<form id="txnForm">' + modalHead(t ? '编辑流水' : '记一笔', t ? t.date : '几秒钟记完，别让账过夜') + '<div class="modal-body">' + body + '</div>' + foot + '</form>');
  syncTxnTypeUI();
}
function syncTxnTypeUI() {
  var root = $('#modalRoot'), type = modalCtx.type;
  $$('[data-act="txn-type"]', root).forEach(function (b) { b.classList.toggle('active', b.dataset.val === type); });
  var cats = D().categories.filter(function (c) { return c.type === (type === 'income' ? 'income' : 'expense'); });
  if (cats.map(function (c) { return c.id; }).indexOf(modalCtx.catId) < 0) modalCtx.catId = cats[0] ? cats[0].id : '';
  var cf = $('#catField', root); if (cf) cf.style.display = type === 'transfer' ? 'none' : '';
  var tf = $('#toField', root); if (tf) tf.style.display = type === 'transfer' ? '' : 'none';
  var cp = $('#catPicker', root); if (cp) cp.innerHTML = catPickerHtml(type === 'income' ? 'income' : 'expense', modalCtx.catId);
  var ci = $('#catId', root); if (ci) ci.value = modalCtx.catId;
  var accLabel = $('[name="accountId"]', root); if (accLabel) accLabel.closest('.field').querySelector('label').textContent = type === 'transfer' ? '转出账户' : '账户';
  var rec = $('[name="makeRecurring"]', root); if (rec) rec.closest('.checkbox-line').style.display = type === 'transfer' ? 'none' : '';
}
function saveTxn(form) {
  var fd = new FormData(form);
  var amount = parseAmount(fd.get('amount'));
  if (!isFinite(amount) || amount <= 0) { toast('请输入有效的金额', true); return; }
  var type = modalCtx.type, accId = fd.get('accountId'), toId = type === 'transfer' ? fd.get('toAccountId') : '';
  if (type === 'transfer' && accId === toId) { toast('转出和转入账户不能是同一个', true); return; }
  var date = fd.get('date') || todayStr();
  var obj = {
    id: modalCtx.editId || uid(), type: type, amount: amount,
    categoryId: type === 'transfer' ? '' : (fd.get('catId') || ''), accountId: accId, toAccountId: toId,
    date: date, time: fd.get('time') || '12:00', note: String(fd.get('note') || '').trim(), tags: parseTags(fd.get('tags'))
  };
  if (modalCtx.editId) {
    var i = D().txns.findIndex(function (x) { return x.id === modalCtx.editId; });
    if (i >= 0) D().txns[i] = obj;
  } else {
    D().txns.push(obj);
    if (fd.get('makeRecurring')) {
      D().recurring.push({
        id: uid(), type: type, amount: amount, categoryId: obj.categoryId, accountId: accId,
        toAccountId: toId, day: +date.slice(8, 10), note: obj.note || catName(obj.categoryId),
        enabled: true, generated: [monthOf(date)]
      });
    }
  }
  save();
  if (monthOf(date) !== state.month) state.month = monthOf(date);
  var keep = fd.get('keepOpen') && !modalCtx.editId;
  renderView();
  toast(modalCtx.editId ? '已保存修改' : '记好了 · ' + money(amount));
  if (keep) {
    var a = form.querySelector('[name="amount"]'); a.value = ''; a.focus();
    var n = form.querySelector('[name="note"]'); if (n) n.value = '';
  } else closeModal();
}

/* ---------- 账户 / 分类 / 预算 / 目标 / 周期 ---------- */
function openAccountModal(id) {
  var a = id ? accById(id) : null;
  var body = '<div class="field"><label>账户名称</label><input name="accName" autofocus maxlength="20" placeholder="例如：招商银行卡" value="' + esc(a ? a.name : '') + '"></div>'
    + '<div class="field"><label>账户类型</label><select name="accType">' + ACC_TYPES.map(function (x) { return '<option' + (a && a.type === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>'
    + '<div class="field"><label>图标</label>' + emojiPicker(a ? a.icon : '💳') + '<input type="hidden" name="icon" id="pickIcon" value="' + esc(a ? a.icon : '💳') + '"></div>'
    + '<div class="field"><label>标识色</label>' + colorPicker(a ? a.color : PALETTE[0]) + '<input type="hidden" name="color" id="pickColor" value="' + esc(a ? a.color : PALETTE[0]) + '"></div>'
    + '<div class="field"><label>初始余额 <span class="hint">开始记账之前，这个账户里已有的钱</span></label><input name="initial" inputmode="decimal" value="' + (a ? a.initial : 0) + '"></div>';
  openModal('<form id="accountForm">' + modalHead(a ? '编辑账户' : '新增账户', '余额会随流水自动更新') + '<div class="modal-body">' + body + '</div>'
    + modalFoot('', '<button type="submit" class="btn btn-primary">保存</button>') + '</form>');
}
function saveAccount(form) {
  var fd = new FormData(form), name = String(fd.get('accName') || '').trim();
  if (!name) { toast('给账户起个名字吧', true); return; }
  var init = parseAmount(fd.get('initial'));
  if (!isFinite(init)) init = 0;
  var obj = { name: name, type: fd.get('accType'), icon: fd.get('icon') || '💳', color: fd.get('color') || PALETTE[0], initial: init, archived: false };
  var a = modalCtx.editId ? accById(modalCtx.editId) : null;
  if (a) Object.assign(a, obj); else D().accounts.push(Object.assign({ id: uid() }, obj));
  save(); closeModal(); renderView(); toast(a ? '账户已更新' : '账户已添加');
}
function openCatModal(id, type) {
  var c = id ? catById(id) : null;
  var body = '<div class="field"><label>分类名称</label><input name="catName" autofocus maxlength="10" value="' + esc(c ? c.name : '') + '" placeholder="例如：宠物"></div>'
    + '<div class="field"><label>类型</label><select name="catType"' + (c ? ' disabled' : '') + '><option value="expense"' + ((c ? c.type : type) === 'expense' ? ' selected' : '') + '>支出</option><option value="income"' + ((c ? c.type : type) === 'income' ? ' selected' : '') + '>收入</option></select></div>'
    + '<div class="field"><label>图标</label>' + emojiPicker(c ? c.icon : '✨') + '<input type="hidden" name="icon" id="pickIcon" value="' + esc(c ? c.icon : '✨') + '"></div>'
    + '<div class="field"><label>颜色</label>' + colorPicker(c ? c.color : PALETTE[0]) + '<input type="hidden" name="color" id="pickColor" value="' + esc(c ? c.color : PALETTE[0]) + '"></div>';
  openModal('<form id="catForm">' + modalHead(c ? '编辑分类' : '新增分类', '分类会用在记账、预算和报表里') + '<div class="modal-body">' + body + '</div>'
    + modalFoot('', '<button type="submit" class="btn btn-primary">保存</button>') + '</form>');
}
function saveCat(form) {
  var fd = new FormData(form), name = String(fd.get('catName') || '').trim();
  if (!name) { toast('分类名称不能为空', true); return; }
  var c = modalCtx.editId ? catById(modalCtx.editId) : null;
  var obj = { name: name, type: fd.get('catType') || (c ? c.type : modalCtx.catType) || 'expense', icon: fd.get('icon') || '✨', color: fd.get('color') || PALETTE[0] };
  if (c) Object.assign(c, obj); else D().categories.push(Object.assign({ id: uid() }, obj));
  save(); closeModal(); renderView(); toast(c ? '分类已更新' : '分类已添加');
}
function openBudgetModal() {
  var m = state.month, b = budgetOf(m) || { total: 0, cats: {} };
  var cats = D().categories.filter(function (c) { return c.type === 'expense'; });
  var body = '<div class="field"><label>本月总预算 <span class="hint">' + monthCN(m) + '，留空表示不设总预算</span></label>'
    + '<input name="total" inputmode="decimal" value="' + (b.total || '') + '" placeholder="例如 8000"></div>'
    + '<div class="divider"></div><div class="field"><label>分类预算 <span class="hint">只填需要单独管住的分类，留空即可</span></label>'

/* ---------- 导入导出 ---------- */
function download(name, content, mime) {
  var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 400);
}
function csvCell(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function exportCSV() {
  var rows = [['日期', '时间', '类型', '金额', '分类', '账户', '转入账户', '备注', '标签']];
  D().txns.slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); }).forEach(function (t) {
    rows.push([t.date, t.time, { expense: '支出', income: '收入', transfer: '转账' }[t.type], t.amount,
      t.type === 'transfer' ? '' : catName(t.categoryId), accName(t.accountId), t.toAccountId ? accName(t.toAccountId) : '',
      t.note, (t.tags || []).join(' ')]);
  });
  var csv = '\uFEFF' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  download('小账本-流水-' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  toast('已导出 ' + D().txns.length + ' 笔流水');
}
function exportJSON() {
  download('小账本-备份-' + todayStr() + '.json', JSON.stringify(D(), null, 2), 'application/json;charset=utf-8');
  toast('备份已下载，建议存到网盘或 U 盘');
}
function parseCSV(text) {
  var rows = [], row = [], cell = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim(); }); });
}
function importCSV(text) {
  var rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV 里没有可导入的数据', true); return; }
  var head = rows[0].map(function (x) { return String(x).trim(); });
  function idx(names) { for (var i = 0; i < head.length; i++) if (names.indexOf(head[i]) >= 0) return i; return -1; }
  var iDate = idx(['日期', 'date', 'Date']), iType = idx(['类型', 'type']), iAmt = idx(['金额', 'amount']),
    iCat = idx(['分类', 'category']), iAcc = idx(['账户', 'account']), iNote = idx(['备注', '说明', 'note']),
    iTime = idx(['时间', 'time']), iTag = idx(['标签', 'tag']);
  if (iDate < 0 || iAmt < 0) { toast('CSV 需要包含「日期」和「金额」两列', true); return; }
  var added = 0;
  rows.slice(1).forEach(function (r) {
    var rawDate = String(r[iDate] || '').trim().replace(/\//g, '-');
    var m = rawDate.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (!m) return;
    var amount = parseAmount(r[iAmt]);
    if (!isFinite(amount) || amount <= 0) return;
    var ty = String(iType >= 0 ? r[iType] : '').trim();
    var type = ty.indexOf('收') >= 0 || /income/i.test(ty) ? 'income' : ty.indexOf('转') >= 0 ? 'transfer' : 'expense';
    var cn = String(iCat >= 0 ? r[iCat] : '').trim();
    var cat = D().categories.find(function (c) { return c.name === cn && c.type === (type === 'income' ? 'income' : 'expense'); });
    if (!cat) cat = D().categories.find(function (c) { return c.name === '其他' && c.type === (type === 'income' ? 'income' : 'expense'); });
    var an = String(iAcc >= 0 ? r[iAcc] : '').trim();
    var acc = D().accounts.find(function (a) { return a.name === an; }) || D().accounts[0];
    D().txns.push({
      id: uid(), type: type, amount: amount, categoryId: type === 'transfer' ? '' : (cat ? cat.id : ''),
      accountId: acc.id, toAccountId: '', date: m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]),
      time: String(iTime >= 0 ? r[iTime] : '12:00').trim().slice(0, 5) || '12:00',
      note: String(iNote >= 0 ? r[iNote] : '').trim(), tags: parseTags(iTag >= 0 ? r[iTag] : '')
    });
    added++;
  });
  if (!added) { toast('没有识别到有效流水，请检查日期格式（YYYY-MM-DD）', true); return; }
  save(); renderView(); toast('已导入 ' + added + ' 笔流水');
}
function importJSON(text) {
  var d;
  try { d = JSON.parse(text); } catch (e) { toast('文件不是有效的 JSON', true); return; }
  if (!d || !Array.isArray(d.txns)) { toast('这不是小账本的备份文件', true); return; }
  confirmDialog('导入备份', '将用备份中的 <strong>' + d.txns.length + '</strong> 笔流水覆盖当前全部数据，此操作不可撤销。', function () {
    var oldSettings = D().settings;
    state.data = normalize(d);
    state.data.settings = Object.assign({}, oldSettings, d.settings || {});
    save(); closeModal(); applyTheme(); renderView(); toast('备份已恢复');
  });
}

/* ---------- 微信 / 支付宝账单导入 ---------- */
function reparseBill() {
  var includeRefund = !!(document.getElementById('billRefund') && document.getElementById('billRefund').checked);
  var keepAcc = billPending && billPending.accountId;
  var existing = D().txns.slice(), reports = [];
  billRaw.forEach(function (raw) {
    var rep = BillImport.parse(raw.text, {
      existing: existing, categories: D().categories,
      encoding: raw.encoding, fileName: raw.fileName, includeRefund: includeRefund
    });
    reports.push(rep);
    if (rep.ok) rep.items.forEach(function (it) {
      existing.push({ src: it.src });
      existing.push({ date: it.date, amount: it.amount, note: it.note });
    });
  });
  var items = [];
  reports.forEach(function (r) { if (r.ok) items = items.concat(r.items); });
  items.sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
  var sk = { dup: 0, nodate: 0, invalid: 0, closed: 0, neutral: 0, refund: 0, zero: 0 };
  reports.forEach(function (r) {
    if (r.ok) Object.keys(sk).forEach(function (k) { sk[k] += r.skipped[k] || 0; });
  });
  billPending = { reports: reports, items: items, skipped: sk, includeRefund: includeRefund, accountId: keepAcc };
}
function resolveBillAccount(pay, defId) {
  var s = String(pay || ''), accs = D().accounts, hit = null;
  if (/微信|零钱/.test(s)) hit = accs.find(function (a) { return /微信|零钱/.test(a.name); });
  else if (/支付宝|余额宝|花呗|余额/.test(s)) hit = accs.find(function (a) { return /支付宝|花呗|余额/.test(a.name); });
  else {
    var m = s.match(/(\d{4})\)?$/);
    if (m) hit = accs.find(function (a) { return a.name.indexOf(m[1]) >= 0; });
  }
  return hit ? hit.id : defId;
}

/* ---------- 事件总线 ---------- */
document.addEventListener('click', function (e) {
  var nav = e.target.closest('.nav-item');
  if (nav) { goView(nav.dataset.view); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act, id = el.dataset.id, val = el.dataset.val;
  switch (act) {
    case 'backdrop': if (e.target === el) closeModal(); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-yes': if (pendingConfirm) { var f = pendingConfirm; pendingConfirm = null; f(); } break;
    case 'goto': goView(el.dataset.view); break;
    case 'month-step': state.month = shiftMonth(state.month, +val); ensureRecurring(); renderView(); break;
    case 'month-now': state.month = curMonth(); ensureRecurring(); renderView(); break;
    case 'add-txn': openTxnModal(); break;
    case 'edit-txn': openTxnModal(id); break;
    case 'del-txn': deleteTxn(id); break;
    case 'undo-del': undoDelete(); break;
    case 'txn-type': modalCtx.type = val; modalCtx.catId = ''; syncTxnTypeUI(); break;
    case 'pick-cat':
      modalCtx.catId = id;
      $$('#catPicker .cat-opt').forEach(function (b) { b.classList.toggle('active', b.dataset.id === id); });
      $('#catId').value = id; break;
    case 'add-tag': {
      var inp = $('[name="tags"]');
      if (inp) { var cur = inp.value.trim(); inp.value = (cur ? cur + ' ' : '') + val; inp.focus(); }
      break;
    }
    case 'pick-emoji': setPickerValue($('#modalRoot'), '#pickIcon', val); break;
    case 'pick-color': setPickerValue($('#modalRoot'), '#pickColor', val); break;
    case 'rec-type': {
      $$('[data-act="rec-type"]').forEach(function (b) { b.classList.toggle('active', b.dataset.val === val); });
      $('#recType').value = val;
      var sel = $('[name="catId"]'); if (sel) sel.innerHTML = optCats(val, '', false);
      break;
    }
    case 'edit-account': modalCtx.editId = id || null; openAccountModal(id); break;
    case 'del-account': deleteAccount(id); break;
    case 'edit-cat': modalCtx.editId = id || null; modalCtx.catType = el.dataset.type || 'expense'; openCatModal(id, modalCtx.catType); break;
    case 'del-cat': deleteCat(id); break;
    case 'edit-budget': openBudgetModal(); break;
    case 'edit-goal': modalCtx.editId = id || null; openGoalModal(id); break;
    case 'del-goal': deleteGoal(id); break;
    case 'goal-deposit': openDepositModal(id); break;
    case 'edit-recurring': modalCtx.editId = id || null; openRecurringModal(id); break;
    case 'del-recurring': deleteRecurring(id); break;
    case 'toggle-recurring': {
      var r = D().recurring.find(function (x) { return x.id === id; });
      if (r) { r.enabled = !r.enabled; save(); renderView(); toast(r.enabled ? '规则已启用' : '规则已停用'); }
      break;
    }
    case 'filter-type': state.filters.type = val; state.txnPage = 0; renderView(); break;
    case 'filter-scope': state.filters.scope = val; state.txnPage = 0; renderView(); break;
    case 'clear-q': state.filters.q = ''; renderView(); setTimeout(function () { var s = $('#searchInput'); if (s) s.focus(); }, 0); break;
    case 'txn-more': state.txnPage++; $('#txnList').innerHTML = txnListHtml(); break;
    case 'report-tab': state.reportTab = val; renderView(); break;
    case 'year-step': state.reportsYear += +val; renderView(); break;
    case 'toggle-theme': D().settings.theme = D().settings.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); renderView(); break;
    case 'toggle-privacy': D().settings.privacy = !D().settings.privacy; save(); applyPrivacyBtn(); renderView(); break;
    case 'export-csv': exportCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'import-json': pendingImport = 'json'; $('#fileInput').click(); break;
    case 'import-csv': pendingImport = 'csv'; $('#fileInput').click(); break;
    case 'import-bill': pendingImport = 'bill'; $('#fileInput').click(); break;
    case 'undo-batch': undoDelete(); break;
    case 'clear-demo': clearAll(false); break;
    case 'load-demo': loadDemo(); break;
    case 'wipe': clearAll(true); break;
  }
});
function goView(v) {
  state.view = v;
  state.txnPage = 0;
  if (v === 'reports') state.reportsYear = +state.month.slice(0, 4);
  renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  switch (el.dataset.act) {
    case 'filter-cat': state.filters.cat = el.value; state.txnPage = 0; renderView(); break;
    case 'filter-acc': state.filters.acc = el.value; state.txnPage = 0; renderView(); break;
    case 'set-currency': {
      var v = el.value.trim() || '¥';
      D().settings.currency = v.slice(0, 3); save(); renderView(); toast('货币符号已更新');
      break;
    }
    case 'bill-refund': {
      var bf = document.getElementById('billForm');
      var acc = bf ? new FormData(bf).get('accountId') : null;
      reparseBill();
      if (acc) billPending.accountId = acc;
      openBillPreview();
      break;
    }
  }
});
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'filter-q') {
    state.filters.q = el.value;
    state.txnPage = 0;
    var box = $('#txnList');
    if (box) box.innerHTML = filteredTxns().length ? txnListHtml() : emptyHtml('没有符合条件的流水', '换个关键词试试', 'i-search');
    var sum = $('#txnSummary');
    if (sum) sum.innerHTML = txnSummaryHtml();
  }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var form = e.target;
  switch (form.id) {
    case 'txnForm': saveTxn(form); break;
    case 'accountForm': saveAccount(form); break;
    case 'catForm': saveCat(form); break;
    case 'budgetForm': saveBudget(form); break;
    case 'goalForm': saveGoal(form); break;
    case 'depositForm': saveDeposit(form); break;
    case 'recurringForm': saveRecurring(form); break;
    case 'billForm': applyBillImport(form); break;
  }
});
document.addEventListener('keydown', function (e) {
  var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (e.key === 'Escape') { if ($('#modalRoot').innerHTML) closeModal(); return; }
  if (typing || $('#modalRoot').innerHTML || e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); openTxnModal(); }
  else if (k === '/') { e.preventDefault(); if (state.view !== 'transactions') goView('transactions'); setTimeout(function () { var s = $('#searchInput'); if (s) s.focus(); }, 60); }
  else if (k === 'h') { D().settings.privacy = !D().settings.privacy; save(); applyPrivacyBtn(); renderView(); }
  else if (k === 't') { D().settings.theme = D().settings.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); renderView(); }
  else if (e.key === 'ArrowLeft') { state.month = shiftMonth(state.month, -1); renderView(); }
  else if (e.key === 'ArrowRight') { state.month = shiftMonth(state.month, 1); renderView(); }
});

/* ---------- 删除（带撤销） ---------- */
function deleteTxn(id) {
  var i = D().txns.findIndex(function (x) { return x.id === id; });
  if (i < 0) return;
  var t = D().txns[i];
  D().txns.splice(i, 1);
  undoStack = { kind: 'txn', item: t, index: i };
  save(); closeModal(); renderView();
  toast('已删除这笔流水', false, 'undo-del');
}
function undoDelete() {
  if (!undoStack) return;
  var msg = '已撤销';
  if (undoStack.kind === 'txn') D().txns.splice(Math.min(undoStack.index, D().txns.length), 0, undoStack.item);
  else if (undoStack.kind === 'batch') {
    var set = {};
    undoStack.ids.forEach(function (id) { set[id] = true; });
    D().txns = D().txns.filter(function (t) { return !set[t.id]; });
    msg = '已撤销本次账单导入';
  }
  undoStack = null; save(); renderView(); toast(msg);
}
function deleteAccount(id) {
  var used = D().txns.filter(function (t) { return t.accountId === id || t.toAccountId === id; }).length;
  if (used) { toast('这个账户还有 ' + used + ' 笔流水，不能删除', true); return; }
  confirmDialog('删除账户', '确定删除「' + esc(accName(id)) + '」吗？', function () {
    D().accounts = D().accounts.filter(function (a) { return a.id !== id; });
    save(); closeModal(); renderView(); toast('账户已删除');
  }, true);
}
function deleteCat(id) {
  var used = D().txns.filter(function (t) { return t.categoryId === id; }).length;
  if (used) { toast('这个分类下还有 ' + used + ' 笔流水，不能删除', true); return; }
  confirmDialog('删除分类', '确定删除「' + esc(catName(id)) + '」吗？', function () {
    D().categories = D().categories.filter(function (c) { return c.id !== id; });
    save(); closeModal(); renderView(); toast('分类已删除');
  }, true);
}
function deleteGoal(id) {
  confirmDialog('删除目标', '删除后进度记录也会一起消失。', function () {
    D().goals = D().goals.filter(function (g) { return g.id !== id; });
    save(); closeModal(); renderView(); toast('目标已删除');
  }, true);
}
function deleteRecurring(id) {
  confirmDialog('删除周期规则', '已自动生成的流水不会被删除。', function () {
    D().recurring = D().recurring.filter(function (r) { return r.id !== id; });
    save(); closeModal(); renderView(); toast('规则已删除');
  }, true);
}
function clearAll(wipe) {
  confirmDialog(wipe ? '清空全部数据' : '清空示例数据',
    wipe ? '所有流水、账户、分类、预算、目标都会被删除，<strong>无法撤销</strong>。建议先导出一份完整备份。'
      : '将移除全部虚构示例流水和示例账户，得到一个干净的空白账本（保留外观设置）。',
    function () {
      var st = Object.assign({}, D().settings);
      state.data = blankData();
      state.data.categories = defaultCategories();
      state.data.settings = Object.assign(st, { demo: false });
      state.month = curMonth();
      save(); closeModal(); applyTheme(); renderView();
      toast(wipe ? '数据已清空' : '已是空白账本，开始记第一笔吧');
    }, true);
}
function loadDemo() {
  confirmDialog('载入虚构示例数据',
    '会覆盖当前全部数据，生成近 6 个月<strong>随机编造</strong>的示例流水，仅用于预览界面效果，<strong>不是真实账目</strong>。随时可在设置里一键清空。',
    function () {
      var st = Object.assign({}, D().settings);
      state.data = makeDemoData();
      state.data.settings = Object.assign(st, { demo: true, demoSource: 'user' });
      state.month = curMonth();
      save(); closeModal(); applyTheme(); renderView(); toast('已载入虚构示例数据，记得用完清空');
    }, true);
}

/* ---------- 文件读取 ---------- */
$('#fileInput').addEventListener('change', function (e) {
  var files = Array.prototype.slice.call(e.target.files || []);
  if (!files.length) return;
  var mode = pendingImport;
  pendingImport = null;
  e.target.value = '';

  if (mode !== 'bill') {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        if (mode === 'json') importJSON(String(ev.target.result));
        else if (mode === 'csv') importCSV(String(ev.target.result));
      } catch (err) { toast('导入失败：' + err.message, true); }
    };
    reader.readAsText(files[0], 'utf-8');
    return;
  }

  billRaw = []; billPending = null;
  var left = files.length, bad = [];
  function finish() {
    billRaw = billRaw.filter(Boolean);
    if (!billRaw.length) {
      openModal(modalHead('账单文件无法读取', '需要先处理一下文件格式')
        + '<div class="modal-body"><div class="bill-error">' + bad.map(esc).join('<br>')
        + '<div class="tiny muted" style="margin-top:10px">微信、支付宝发到邮箱的是加密压缩包；解压后取里面的 CSV。若拿到的是 .xlsx，请用 WPS / Excel「另存为 → CSV UTF-8」。</div></div></div>'
        + modalFoot('', ''));
      return;
    }
    reparseBill();
    openBillPreview();
    if (bad.length) toast(bad.length + ' 个文件被跳过：' + bad[0], true);
  }
  files.forEach(function (f, idx) {
    var fr = new FileReader();
    fr.onload = function (ev) {
      var bytes = new Uint8Array(ev.target.result);
      if (bytes.length > 1 && bytes[0] === 0x50 && bytes[1] === 0x4B) {
        bad.push(f.name + '：是压缩包或 Excel 文件，请解压并另存为 CSV');
      } else {
        var d = BillImport.decode(bytes);
        billRaw[idx] = { text: d.text, encoding: d.encoding, fileName: f.name };
      }
      if (--left === 0) finish();
    };
    fr.onerror = function () { bad.push(f.name + '：读取失败'); if (--left === 0) finish(); };
    fr.readAsArrayBuffer(f);
  });
});
$('#themeToggle').addEventListener('click', function () {
  D().settings.theme = D().settings.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); renderView();
});
$('#privacyToggle').addEventListener('click', function () {
  D().settings.privacy = !D().settings.privacy; save(); applyPrivacyBtn(); renderView();
});
$('#addBtn').addEventListener('click', function () { openTxnModal(); });
$('#fab').addEventListener('click', function () { openTxnModal(); });
$('#prevMonth').addEventListener('click', function () { state.month = shiftMonth(state.month, -1); ensureRecurring(); renderView(); });
$('#nextMonth').addEventListener('click', function () { state.month = shiftMonth(state.month, 1); ensureRecurring(); renderView(); });
$('#monthLabel').addEventListener('click', function () { state.month = curMonth(); ensureRecurring(); renderView(); toast('已回到本月'); });

/* ---------- 启动 ---------- */
(function boot() {
  load();
  state.month = curMonth();
  state.reportsYear = new Date().getFullYear();
  applyTheme();
  applyPrivacyBtn();
  ensureRecurring();
  renderView();
  if (migratedDemo) {
    setTimeout(function () { toast('已移除自动载入的虚构示例数据，账本现在是干净的'); }, 500);
  }
})();

</script>
